[package]
name = "galgo-gui"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libc = "0.2"
iced = { version = "0.13", features = ["tokio", "lazy", "canvas"] }
galgo-proto = { path = "../galgo-proto" }
galgo-usage = { path = "../galgo-usage" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
ttf-parser = "0.20"
unicode-width = "0.2"
toml = "0.8"
sha2 = "=0.10.8"
regex = "=1.11.1"

[dev-dependencies]
iced_core = "0.13"
iced_graphics = "0.13"
iced_runtime = "0.13"
iced_tiny_skia = "0.13"
tiny-skia = "0.11"
