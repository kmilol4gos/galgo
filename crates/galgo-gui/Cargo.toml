[package]
name = "galgo-gui"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libc = "0.2"
iced = { version = "0.13", features = ["tokio", "lazy"] }
galgo-proto = { path = "../galgo-proto" }
galgo-usage = { path = "../galgo-usage" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt"] }
rfd = "0.18.0"
ttf-parser = "0.20"

[dev-dependencies]
iced_core = "0.13"
iced_graphics = "0.13"
iced_runtime = "0.13"
iced_tiny_skia = "0.13"
tiny-skia = "0.11"
