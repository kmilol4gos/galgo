[package]
name = "galgo-gui"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
iced = { version = "0.13", features = ["tokio", "lazy"] }
galgo-proto = { path = "../galgo-proto" }
galgo-usage = { path = "../galgo-usage" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt"] }
