[package]
name = "galgo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "galgod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
galgo-proto = { version = "0.1.0", path = "../galgo-proto" }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
vt100 = "0.18.1"
