[package]
name = "galgo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "galgo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
galgo-proto = { version = "0.1.0", path = "../galgo-proto" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
libc = "0.2.191"
