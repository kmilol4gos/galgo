name: release

"on":
  push:
    tags:
      - 'v*'

# Ningún job recibe permisos implícitos; cada uno pide solo lo necesario.
permissions: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Validar tag de release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag inválido para release; usa vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar Rust del runner
        run: |
          rustc --version
          cargo --version
      - name: Compilar e instalar en staging
        env:
          PREFIX: ${{ runner.temp }}/galgo-release/bin
        run: scripts/install.sh
      - name: Crear bundle y tarball
        env:
          PREFIX: ${{ runner.temp }}/galgo-release/bin
          STAGING: ${{ runner.temp }}/galgo-release
        run: |
          scripts/make-app.sh --output "$STAGING/galgo.app"
          ARCHIVE="galgo-${GITHUB_REF_NAME}-macos-$(uname -m).tar.gz"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          tar -C "$STAGING" -czf "$RUNNER_TEMP/release-artifact/$ARCHIVE" bin galgo.app
      - name: Subir artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: galgo-macos
          path: ${{ runner.temp }}/release-artifact/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Validar tag de release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag inválido para release; usa vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
      - name: Descargar artefacto
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: galgo-macos
          path: ${{ runner.temp }}/release-artifact
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No hay checkout en este job: gh necesita saber a qué repo publicar.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release-artifact/galgo-${GITHUB_REF_NAME}-macos-"*.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Se esperaba exactamente un tarball para este tag" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${archives[0]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${archives[0]}" --generate-notes
          fi
